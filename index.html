<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sınıf Defteri</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:900px;margin:auto;padding:20px 15px 40px}
h1{margin:0;font-size:29px}
.sub{color:#697386;margin:5px 0 18px}
.card{background:white;border:1px solid #e1e5ec;border-radius:16px;padding:17px}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
label{display:block;font-size:11px;font-weight:800;color:#697386;margin-bottom:6px}
select{width:100%;padding:13px;border:1px solid #d7dce5;border-radius:10px;background:white;font-size:16px}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0}
.week button{border:1px solid #d9dee8;background:white;border-radius:10px;padding:10px 13px;font-size:14px}
.weektitle{text-align:center;font-weight:800}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{background:white;border:1px solid #dfe3eb;border-radius:12px;padding:13px 9px;min-height:82px;text-align:left}
.day.active{border:2px solid #315efb;background:#f1f4ff}
.day b{font-size:13px}
.day small{display:block;color:#697386;margin-top:6px}
.result{margin-top:16px}
.code{display:inline-block;margin:9px 0 5px;padding:5px 8px;background:#eef1f6;border-radius:6px;font:12px monospace}
.outcome{font-size:18px;line-height:1.5;margin:5px 0 15px}
.copy{width:100%;padding:14px;border:0;border-radius:11px;background:#315efb;color:white;font-weight:800;font-size:15px}
.success{background:#198754}
.info{font-size:12px;color:#697386;margin-top:10px;line-height:1.5}
@media(max-width:650px){
.grid{grid-template-columns:1fr}
.days{grid-template-columns:1fr 1fr}
.day:last-child{grid-column:1/-1}
}
</style>
</head>

<body>
<div class="container">

<h1>Sınıf Defteri</h1>
<div class="sub">Haftalık öğrenme çıktısını bul, kopyala, deftere geçir.</div>

<div class="card">
<div class="grid">

<div>
<label>SINIF</label>
<select id="grade">
<option value="1">1. Sınıf</option>
<option value="2">2. Sınıf</option>
<option value="3">3. Sınıf</option>
<option value="4">4. Sınıf</option>
</select>
</div>

<div>
<label>DERS</label>
<select id="subject">
<option value="matematik">Matematik</option>
<option value="turkce">Türkçe</option>
<option value="hayat">Hayat Bilgisi</option>
<option value="fen">Fen Bilimleri</option>
<option value="sosyal">Sosyal Bilgiler</option>
<option value="ingilizce">İngilizce</option>
<option value="muzik">Müzik</option>
<option value="gorsel">Görsel Sanatlar</option>
<option value="beden">Beden Eğitimi ve Oyun</option>
<option value="din">Din Kültürü ve Ahlak Bilgisi</option>
</select>
</div>

</div>
</div>

<div class="week">
<button onclick="changeWeek(-1)">← Önceki</button>
<div class="weektitle" id="weekTitle"></div>
<button onclick="changeWeek(1)">Sonraki →</button>
</div>

<div class="days" id="days"></div>

<div class="card result">
<label>SINIF DEFTERİNE YAZILACAK</label>
<div class="code" id="code">—</div>
<div class="outcome" id="outcome">—</div>

<button class="copy" id="copy" onclick="copyText()">
Sınıf Defterine Kopyala
</button>

<div class="info" id="info"></div>
</div>

</div>

<script>
let week=0;
let selectedDay=0;

const firstDay=new Date(2026,8,14);
const dayNames=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma"];

const outcomes={
"1-matematik":[
["MAT.1.3.1","Hedefe ulaşmak için mesafeleri ve yönleri içeren yönergeleri çözümleyebilme"],
["MAT.1.3.2","Nesnelerin eşliğini değerlendirebilme"]
]
};

function startDate(){
let d=new Date(firstDay);
d.setDate(d.getDate()+week*7);
return d;
}

function dateText(d){
return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"});
}

function render(){
let start=startDate();
let end=new Date(start);
end.setDate(end.getDate()+4);

weekTitle.textContent=dateText(start)+" – "+dateText(end);

days.innerHTML="";

for(let i=0;i<5;i++){
let d=new Date(start);
d.setDate(d.getDate()+i);

let b=document.createElement("button");
b.className="day "+(i===selectedDay?"active":"");

b.innerHTML=
"<b>"+dayNames[i]+"</b>"+
"<small>"+dateText(d)+"</small>";

b.onclick=()=>{
selectedDay=i;
render();
};

days.appendChild(b);
}

update();
}

function update(){
let key=grade.value+"-"+subject.value;
let data=outcomes[key];

if(week===0 && data){

let item=data[Math.min(selectedDay,data.length-1)];

code.textContent=item[0];
outcome.textContent=item[1];

info.textContent=
"Kaynak: İlkokul Matematik Dersi Öğretim Programı. "+
"Hafta/gün eşleştirmesi yıllık plan üzerinden ayrıca doğrulanacaktır.";

}else{

code.textContent="PLAN VERİSİ BEKLENİYOR";

outcome.textContent=
"Bu gün için doğrulanmış haftalık öğrenme çıktısı henüz eklenmedi.";

info.textContent=
"Resmî öğretim programı ile yıllık plan verisi ayrı tutulmaktadır.";
}
}

function changeWeek(n){
week+=n;
render();
}

async function copyText(){
try{
await navigator.clipboard.writeText(outcome.textContent);

let b=document.getElementById("copy");
b.textContent="Kopyalandı ✓";
b.classList.add("success");

setTimeout(()=>{
b.textContent="Sınıf Defterine Kopyala";
b.classList.remove("success");
},1500);

}catch(e){
alert("Metin kopyalanamadı.");
}
}

grade.onchange=update;
subject.onchange=update;

render();
</script>

</body>
</html>
