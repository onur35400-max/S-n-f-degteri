<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sınıf Defteri</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:920px;
  margin:auto;
  padding:20px 15px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

h1{
  margin:0;
  font-size:30px;
}

.sub{
  color:#697386;
  margin:5px 0 18px;
}

.badge{
  background:#eef1f6;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.card{
  background:#fff;
  border:1px solid #e1e5ec;
  border-radius:16px;
  padding:17px;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1.5fr;
  gap:12px;
}

label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:#697386;
  margin-bottom:6px;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:10px;
  background:#fff;
  font-size:16px;
}

.week{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:14px 0;
}

.week button{
  border:1px solid #d9dee8;
  background:#fff;
  border-radius:10px;
  padding:11px 13px;
  font-size:14px;
}

.weektitle{
  text-align:center;
  font-weight:800;
}

.days{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.day{
  background:#fff;
  border:1px solid #dfe3eb;
  border-radius:12px;
  padding:13px 9px;
  min-height:82px;
  text-align:left;
  font-size:14px;
}

.day.active{
  border:2px solid #315efb;
  background:#f1f4ff;
}

.day b{
  font-size:13px;
}

.day small{
  display:block;
  color:#697386;
  margin-top:6px;
}

.result{
  margin-top:16px;
}

.status{
  display:inline-block;
  margin:8px 0 5px;
  padding:5px 8px;
  background:#eef1f6;
  border-radius:6px;
  font:12px monospace;
}

.outcome{
  font-size:18px;
  line-height:1.5;
  margin:5px 0 15px;
}

.copy{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#315efb;
  color:#fff;
  font-weight:800;
  font-size:15px;
}

.copy.success{
  background:#198754;
}

.info{
  font-size:12px;
  color:#697386;
  margin-top:10px;
  line-height:1.5;
}

@media(max-width:650px){

  .top{
    display:block;
  }

  .badge{
    display:inline-block;
    margin-top:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .days{
    grid-template-columns:1fr 1fr;
  }

  .day:last-child{
    grid-column:1/-1;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top">

    <div>
      <h1>Sınıf Defteri</h1>

      <div class="sub">
        Haftalık öğrenme çıktısını bul, kopyala, deftere geçir.
      </div>
    </div>

    <div class="badge">
      2026–2027 • TYMM
    </div>

  </div>


  <div class="card">

    <div class="grid">

      <div>

        <label>SINIF</label>

        <select id="grade">

          <option value="1">1. Sınıf</option>
          <option value="2">2. Sınıf</option>
          <option value="3">3. Sınıf</option>
          <option value="4">4. Sınıf</option>

        </select>

      </div>


      <div>

        <label>DERS</label>

        <select id="subject">

          <option value="matematik">Matematik</option>
          <option value="turkce">Türkçe</option>
          <option value="hayat">Hayat Bilgisi</option>
          <option value="fen">Fen Bilimleri</option>
          <option value="sosyal">Sosyal Bilgiler</option>
          <option value="ingilizce">İngilizce</option>
          <option value="muzik">Müzik</option>
          <option value="gorsel">Görsel Sanatlar</option>
          <option value="beden">Beden Eğitimi ve Oyun</option>
          <option value="din">Din Kültürü ve Ahlak Bilgisi</option>

        </select>

      </div>

    </div>

  </div>


  <div class="week">

    <button type="button" id="prev">
      ← Önceki
    </button>

    <div class="weektitle" id="weekTitle"></div>

    <button type="button" id="next">
      Sonraki →
    </button>

  </div>


  <div class="days" id="days"></div>


  <div class="card result">

    <label>
      SINIF DEFTERİNE YAZILACAK
    </label>

    <div class="status" id="code">
      PLAN VERİSİ BEKLENİYOR
    </div>

    <div class="outcome" id="outcome">
      Bu hafta için doğrulanmış yıllık plan satırı henüz içeri aktarılmadı.
    </div>

    <button type="button" class="copy" id="copy">
      Sınıf Defterine Kopyala
    </button>

    <div class="info" id="info"></div>

  </div>

</div>


<script>

const firstDay = new Date(2026,8,14);

const names = [
  "Pazartesi",
  "Salı",
  "Çarşamba",
  "Perşembe",
  "Cuma"
];

let week = 0;
let day = 0;


const curriculum = {

  "1-matematik":[

    [
      "MAT.1.1.1",
      "Rakamları ve 20’ye kadar olan sayıları (20 dâhil), niceliklerin büyüklüklerini temsil etmek için kullanabilme"
    ],

    [
      "MAT.1.1.2",
      "Ögeleri dağınık veya düzenli bir şekilde bulunan bir nesne grubunu sayarken parçalar arasında ilişkileri çözümleyebilme"
    ],

    [
      "MAT.1.1.3",
      "Nesnelerin sıra sayısını gösterebilme"
    ],

    [
      "MAT.1.1.4",
      "İki niceliğin büyüklüğünü “çok”, “daha çok”, “az”, “daha az” veya “eşit” terimleriyle karşılaştırabilme"
    ],

    [
      "MAT.1.1.5",
      "100’e kadar ileriye ve 20’den geriye doğru ritmik sayabilme"
    ],

    [
      "MAT.1.1.6",
      "Artan veya azalan sayı ve şekil örüntülerini çözümleyebilme"
    ],

    [
      "MAT.1.1.7",
      "Verilen bir çokluktaki ilişkilerden yararlanarak 20’ye kadar (20 dâhil) olan nesnelerin sayısını tahmin edebilme"
    ]

  ],


  "1-hayat":[

    [
      "HB.1.1.1",
      "Öğretmeni ve arkadaşlarıyla tanışabilme"
    ],

    [
      "HB.1.1.2",
      "Sınıf ve okul ortamını tanıyabilme"
    ],

    [
      "HB.1.1.3",
      "Sınıf ve okul ortamında kurallara uygun davranabilme"
    ],

    [
      "HB.1.1.4",
      "Bireysel özelliklerini açıklayabilme"
    ]

  ]

};


function fmt(d){

  return d.toLocaleDateString(
    "tr-TR",
    {
      day:"numeric",
      month:"long"
    }
  );

}


function render(){

  const s = new Date(firstDay);

  s.setDate(
    s.getDate() + week * 7
  );


  const e = new Date(s);

  e.setDate(
    e.getDate() + 4
  );


  document.getElementById("weekTitle").textContent =
    `${fmt(s)} – ${fmt(e)}`;


  const days =
    document.getElementById("days");


  days.innerHTML = "";


  for(let i=0;i<5;i++){

    const d = new Date(s);

    d.setDate(
      d.getDate() + i
    );


    const b =
      document.createElement("button");

    b.type = "button";

    b.className =
      "day" + (i === day ? " active" : "");


    b.innerHTML =
      `<b>${names[i]}</b>
       <small>${fmt(d)}</small>`;


    b.addEventListener(
      "click",
      function(){

        day = i;

        render();

      }
    );


    days.appendChild(b);

  }


  update();

}


function update(){

  const grade =
    document.getElementById("grade");

  const subject =
    document.getElementById("subject");

  const code =
    document.getElementById("code");

  const outcome =
    document.getElementById("outcome");

  const info =
    document.getElementById("info");


  const key =
    grade.value + "-" + subject.value;


  const items =
    curriculum[key];


  if(items && week === 0){

    const item =
      items[
        Math.min(
          day,
          items.length - 1
        )
      ];


    code.textContent =
      item[0];


    outcome.textContent =
      item[1];


    info.textContent =
      "Öğrenme çıktısı MEB/TYMM öğretim programından doğrulanmıştır. Haftalık gün eşleştirmesi yıllık plan satırıyla ayrıca doğrulanmalıdır.";

  }

  else{

    code.textContent =
      "PLAN VERİSİ BEKLENİYOR";


    outcome.textContent =
      "Bu hafta için doğrulanmış yıllık plan satırı henüz içeri aktarılmadı.";


    info.textContent =
      "Uygulama, öğretim programı ile haftalık/yıllık plan verisini ayrı tutar; doğrulanmamış eşleştirme göstermez.";

  }

}


document.getElementById("prev")
.addEventListener(
  "click",
  function(){

    week--;

    render();

  }
);


document.getElementById("next")
.addEventListener(
  "click",
  function(){

    week++;

    render();

  }
);


document.getElementById("grade")
.addEventListener(
  "change",
  update
);


document.getElementById("subject")
.addEventListener(
  "change",
  update
);


document.getElementById("copy")
.addEventListener(
  "click",
  async function(){

    const outcome =
      document.getElementById("outcome");

    const copy =
      document.getElementById("copy");


    try{

      await navigator.clipboard.writeText(
        outcome.textContent
      );


      copy.textContent =
        "Kopyalandı ✓";


      copy.classList.add("success");


      setTimeout(
        function(){

          copy.textContent =
            "Sınıf Defterine Kopyala";

          copy.classList.remove(
            "success"
          );

        },
        1400
      );

    }

    catch(e){

      alert(
        "Metin kopyalanamadı."
      );

    }

  }
);


render();

</script>

</body>
</html>
